# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: CI

on: # yamllint disable-line rule:truthy
  - push
  - pull_request

jobs:
  ci:
    runs-on: codeberg-small-lazy
    container: catthehacker/ubuntu:act-latest
    env:
      MISE_ENV: ci

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-yaml

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: .tmp-ansible-collection-checkout

      # Code for getting metadata and moving the collection is lifted from:
      # https://github.com/ansible-community/ansible-test-gh-action/blob/dbaa27862be5c7cbebe4ff720cf400341beb9df1/action.yml
      # It has been simplified a bit as not all of the options need to be supported.

      - name: Extract the collection metadata
        id: collection-metadata
        run: |
          import os
          import pathlib
          import yaml

          FILE_APPEND_MODE = 'a'
          OUTPUTS_FILE_PATH = pathlib.Path(os.environ['GITHUB_OUTPUT'])

          def set_output(name, value):
              with OUTPUTS_FILE_PATH.open(FILE_APPEND_MODE) as outputs_file:
                  outputs_file.writelines(f'{name}={value}{os.linesep}')

          directory = ".tmp-ansible-collection-checkout"

          COLLECTION_META_FILE = 'galaxy.yml'
          with open(os.path.join(directory, COLLECTION_META_FILE)) as galaxy_yml:
              collection_meta = yaml.safe_load(galaxy_yml)

          coll_name = collection_meta['name']
          coll_ns = collection_meta['namespace']

          set_output('name', coll_name)
          set_output('namespace', coll_ns)

          set_output('fqcn', f'{coll_ns}.{coll_name}')

          wanted_path = f'ansible_collections{os.sep}{coll_ns}{os.sep}{coll_name}'
          if directory.endswith(wanted_path):
              set_output('copy-to-checkout-path', 'false')
              set_output(
                  'collection-namespace-path',
                  os.path.normpath(os.path.join(directory, '..')))
              set_output('checkout-path', directory)
          else:
              set_output('copy-to-checkout-path', 'true')
              set_output(
                  'collection-namespace-path',
                  os.path.join('ansible_collections', coll_ns))
              set_output(
                  'checkout-path',
                  os.path.join('ansible_collections', coll_ns, coll_name))
        shell: python

      - name: Move the collection to the proper path
        if: ${{ fromJSON(steps.collection-metadata.outputs.copy-to-checkout-path) }}
        run: |
          mkdir -p "${{ steps.collection-metadata.outputs.collection-namespace-path }}"
          mv ".tmp-ansible-collection-checkout" "${{ steps.collection-metadata.outputs.checkout-path }}"

      - name: Set up mise
        uses: https://github.com/jdx/mise-action@v4
        with:
          github_token: ${{ secrets.HOMELAB_GITHUB_TOKEN }}
          working_directory: ${{ steps.collection-metadata.outputs.checkout-path }}

      # `mise which` is used instead of `mise exec` because `mise exec` would
      # install dependencies first
      - name: Get uv cache dir
        id: uv-cache
        run: |
          dir="$("$(mise which uv)" cache dir)"
          echo "$dir"
          echo "dir=$dir" >> $GITHUB_OUTPUT
        working-directory: ${{ steps.collection-metadata.outputs.checkout-path }}

      - name: Set up uv cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.uv-cache.outputs.dir }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Set up ansible cache
        uses: actions/cache@v6
        with:
          path: ~/.ansible
          key: ${{ runner.os }}-ansible-${{ hashFiles('galaxy.yml', 'requirements.txt') }}
          restore-keys: ${{ runner.os }}-ansible-

      - name: Install dependencies
        run: mise deps
        working-directory: ${{ steps.collection-metadata.outputs.checkout-path }}

      - name: Run CI tasks
        run: mise run ci
        env:
          COMMITLINT_FROM: ${{ forgejo.event.pull_request.base.sha }}
          COMMITLINT_TO: ${{ forgejo.event.pull_request.head.sha }}
        working-directory: ${{ steps.collection-metadata.outputs.checkout-path }}

      - name: Remove docs bloat
        run: rm -rf build/docs/.venv build/docs/build/doctrees
        working-directory: ${{ steps.collection-metadata.outputs.checkout-path }}

      - name: Upload build artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ forgejo.event.repository.name }}-${{ env.FORGEJO_SHA }}
          path: ${{ steps.collection-metadata.outputs.checkout-path }}/build/*

      - name: Deploy docs
        uses: https://codeberg.org/git-pages/action@v2.2.0
        if: ${{ forge.ref_type == 'tag' && forge.server_url == 'https://codeberg.org' }}
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/${{ forgejo.event.repository.name }}/
          token: ${{ forge.token }}
          source: ${{ steps.collection-metadata.outputs.checkout-path }}/build/docs/build/html/

#:schema https://mise.jdx.dev/schema/mise.json

[deps.uv]
auto = true

[env]
ANSIBLE_CONFIG = ".config/ansible.cfg"

[settings]
experimental = true

[settings.python]
uv_venv_auto = "source"

[tasks."ansible:galaxy:build"]
description = "Build an Ansible collection artifact that can be published to Ansible Galaxy"
run = "ansible-galaxy collection build --output-path build --force"
alias = ["build"]
wait_for = ["lint:ansible", "test:ansible:*"]  # There is a concurrency bug

[tasks."ansible:galaxy:install"]
description = "Install collection"
run = "ansible-galaxy collection install --force build/cinnaminimum-homelab-*.tar.gz"
alias = ["install"]
wait_for = ["ansible:galaxy:build"]

[tasks."ansible:test:integration"]
description = "Run ansible integration tests"
run = "ansible-test integration"
alias = ["test:ansible:integration"]

[tasks."ansible:test:sanity"]
description = "Run ansible sanity tests"
run = "ansible-test sanity --python 3.14"
alias = ["test:ansible:sanity"]

[tasks."ansible:test:units"]
description = "Run ansible unit tests"
run = "ansible-test units --python 3.14"
alias = ["test:ansible:units"]

[tasks."changelog:generate:fragment"]
description = "Generate a changelog fragment"
run = "uv run scripts/tasks/generate-changelog-fragment.py"

[tasks."changelog:lint"]
description = "Check changelog fragments for syntax errors"
run = "antsibull-changelog lint"
alias = ["lint:changelog"]

[tasks."changelog:lint:all"]
description = "Run all changelog linters"
depends = ["lint:changelog", "lint:changelog-yaml"]
alias = ["lint:changelog:all"]

[tasks."changelog:lint-changelog-yaml"]
description = "Check syntax of changelogs/changelog.yaml file"
run = "antsibull-changelog lint-changelog-yaml changelogs/changelog.yaml"
alias = ["lint:changelog-yaml"]

[tasks.ci]
description = "Run CI tasks"
depends = ["build", "docs:build", "install", "format:check", "lint:all", "test"]

[tasks.commitlint]
description = "Run commitlint with project configuration"
run = "commitlint --config .config/commitlint.yml"
env.GIT_CONFIG_COUNT = "1"
env.GIT_CONFIG_KEY_0 = "log.showSignature"
env.GIT_CONFIG_VALUE_0 = "false"

[tasks."docs:build"]
description = "Build documentation"
run = "uv run scripts/tasks/build-docs.py"
alias = ["build:docs"]
depends = ["build", "install"]

[tasks."docs:lint"]
description = "Run antsibull-docs linter"
run = "antsibull-docs lint-collection-docs --plugin-docs --check-extra-docs-refs --skip-rstcheck ."
alias = ["lint:docs"]
wait_for = ["install"]

[tasks."format:check"]
description = "Run all file formatters in check mode"
depends = ["format:check:ruff", "format:check:tombi"]

[tasks."git:commit-msg"]
description = "Git commit-msg hook"
run = "mise run commitlint -- --edit $1"

[tasks."git:hooks"]
description = "Configure local git hooks"
run = "git config --local core.hooksPath scripts/githooks"

[tasks."git:pre-commit"]
description = "Git pre-commit hook"
depends = ["format:check", "lint", "test"]

[tasks.lint]
description = "Run (practically) all linters"
depends = ["lint:ansible", "lint:changelog:all", "lint:docs", "lint:ruff", "lint:tombi", "lint:ty"]

[tasks."lint:all"]
description = "Run (literally) all linters"
depends = ["lint", "lint:commitlint"]

[tasks."lint:ansible"]
description = "Run ansible-lint"
run = "ansible-lint"

[tasks."lint:commitlint"]
description = "Run project commitlint wrapper"
run = "uv run scripts/tasks/commitlint.py"

[tasks.release]
description = "Release a new version"
run = "uv run scripts/tasks/release.py"

[tasks.ruff]
description = "Run ruff with project settings"
run = "ruff --config .config/ruff.toml"

[tasks."ruff:format:check"]
description = "Check python file formatting with ruff"
run = "mise run ruff -- format --check"
alias = ["format:check:ruff"]

[tasks."ruff:lint"]
description = "Lint python files with ruff"
run = "mise run ruff -- check"
alias = ["lint:ruff"]

[tasks.test]
description = "Run (practically) all tests"
depends = ["test:ansible:sanity", "test:ansible:units"]

[tasks."test:all"]
description = "Run (literally) all tests"
depends = ["test:ansible"]

[tasks."test:ansible"]
description = "Run ansible tests"
depends = ["test:ansible:integration", "test:ansible:sanity", "test:ansible:units"]

[tasks."tombi:format:check"]
description = "Check format of toml files with tombi"
run = "tombi format --check"
alias = ["format:check:tombi"]

[tasks."tombi:lint"]
description = "Lint toml files with tombi"
run = "tombi lint"
alias = ["lint:tombi"]

[tasks."ty:lint"]
description = "Type-check python files with ty"
run = "ty check"
alias = ["lint:ty"]

[tools]
node = "latest"
"npm:@ansible/ansible-language-server" = "latest"
"npm:@commitlint/cli" = "latest"
"pipx:ansible-creator" = "latest"
"pipx:ansible-lint" = { version = "latest", uvx_args = "--with distlib" }
"pipx:antsibull-changelog" = "latest"
"pipx:antsibull-docs" = "latest"
ruff = "latest"
tombi = "latest"
ty = "latest"
uv = "latest"

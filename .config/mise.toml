#:schema https://mise.jdx.dev/schema/mise.json

[deps.uv]
auto = true

[settings]
experimental = true

[settings.python]
uv_venv_auto = "source"

[tasks."ansible:test:integration"]
description = "Run ansible integration tests"
run = "ansible-test integration --python 3.14"
alias = ["test:ansible:integration"]

[tasks."ansible:test:sanity"]
description = "Run ansible sanity tests"
run = "ansible-test sanity --python 3.14"
alias = ["test:ansible:sanity"]

[tasks."ansible:test:units"]
description = "Run ansible unit tests"
run = "ansible-test units --python 3.14"
alias = ["test:ansible:units"]

[tasks.ci]
description = "Run CI tasks"
depends = ["lint:all", "test"]

[tasks.commitlint]
description = "Run commitlint with project configuration"
run = "commitlint --config .config/commitlint.yml"
env.GIT_CONFIG_COUNT = "1"
env.GIT_CONFIG_KEY_0 = "log.showSignature"
env.GIT_CONFIG_VALUE_0 = "false"

[tasks."git:commit-msg"]
description = "Git commit-msg hook"
run = "mise run commitlint -- --edit $1"

[tasks."git:hooks"]
description = "Configure local git hooks"
run = "git config --local core.hooksPath scripts/githooks"

[tasks."git:pre-commit"]
description = "Git pre-commit hook"
depends = ["lint", "test"]

[tasks.lint]
description = "Run (practically) all linters"
depends = ["lint:ansible"]

[tasks."lint:all"]
description = "Run (literally) all linters"
depends = ["lint:ansible", "lint:commitlint"]

[tasks."lint:ansible"]
description = "Run ansible-lint"
run = "ansible-lint"

[tasks."lint:commitlint"]
description = "Run project commitlint wrapper"
run = "uv run scripts/tasks/commitlint.py"

[tasks.test]
description = "Run tests"
depends = ["test:ansible"]

[tasks."test:ansible"]
description = "Run ansible tests"
depends = ["test:ansible:integration", "test:ansible:sanity", "test:ansible:units"]

[tools]
node = "latest"
"npm:@commitlint/cli" = "latest"
"pipx:ansible-lint" = "latest"
uv = "latest"

# yaml-language-server: $schema=https://www.schemastore.org/commitlintrc.json

defaultIgnores: false

rules:
  body-case:
    - 2
    - always
    - sentence-case

  body-empty:
    - 0

  body-full-stop:
    - 0

  body-leading-blank:
    - 2
    - always

  body-max-length:
    - 0

  body-max-line-length:
    - 2
    - always
    - 72

  body-min-length:
    - 0

  footer-empty:
    - 0

  footer-leading-blank:
    - 2
    - always

  footer-max-length:
    - 0

  footer-max-line-length:
    - 2
    - always
    - 72

  footer-min-length:
    - 0

  header-case:
    - 0

  header-full-stop:
    - 0

  header-max-length:
    - 2
    - always
    - 50

  header-min-length:
    - 0

  header-trim:
    - 2
    - always

  references-empty:
    - 0

  scope-case:
    - 2
    - always
    - lower-case

  scope-empty:
    - 0

  scope-enum:
    - 0

  scope-max-length:
    - 0

  scope-min-length:
    - 0

  signed-off-by:
    - 0

  subject-case:
    - 2
    - always
    - sentence-case

  subject-empty:
    - 2
    - never

  subject-full-stop:
    - 2
    - never
    - .

  subject-max-length:
    - 0

  subject-min-length:
    - 0

  trailer-exists:
    - 0

  type-case:
    - 2
    - always
    - lower-case

  type-empty:
    - 2
    - never

  type-enum:
    - 2
    - always
    -
      - build
      - chore
      - ci
      - docs
      - feat
      - fix
      - perf
      - refactor
      - revert
      - style
      - test

  type-max-length:
    - 0

  type-min-length:
    - 0

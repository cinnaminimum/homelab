# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json#/$defs/tasks

- name: Get temporary directory name
  register: etc_role_mktemp
  changed_when: false

  ansible.builtin.command:
    argv: [mktemp, -u]

- name: Stat temp path
  register: etc_role_stat

  ansible.builtin.stat:
    path: "{{ etc_role_mktemp.stdout }}"

- name: Assert temp path does not exist

  ansible.builtin.assert:
    that: not etc_role_stat.stat.exists

- name: Include etc role with custom directory
  vars:
    etc_homelab_dir: "{{ etc_role_mktemp.stdout }}"

  ansible.builtin.include_role:
    name: cinnaminimum.homelab.etc

- name: Assert etc_homelab_dir fact is set

  ansible.builtin.assert:
    that: etc_homelab_dir == etc_role_mktemp.stdout

- name: Stat etc_homelab_dir
  register: etc_role_stat

  ansible.builtin.stat:
    path: "{{ etc_homelab_dir }}"

- name: Assert etc_homelab_dir exists

  ansible.builtin.assert:
    that: etc_role_stat.stat.exists

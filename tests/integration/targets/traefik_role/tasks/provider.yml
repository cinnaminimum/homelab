# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json#/$defs/tasks

- name: Include traefik role with test file provider
  vars:
    traefik_file_provider: |
      # {{ traefik_role_slug }}
      {}

  ansible.builtin.include_role:
    name: cinnaminimum.homelab.traefik

- name: Flush handlers

  ansible.builtin.meta: flush_handlers

- name: Wait for container
  register: traefik_role_container_info
  become: true
  until: traefik_role_container_info.containers | length > 0

  containers.podman.podman_container_info:
    name: homelab-traefik

- name: Get file provider file content
  register: traefik_role_file_provider
  become: true

  containers.podman.podman_container_exec:
    name: homelab-traefik
    argv: [cat, /etc/traefik/provider.yml]

- name: Assert file provider file content

  ansible.builtin.assert:
    that: traefik_role_file_provider.stdout is search(traefik_role_slug)

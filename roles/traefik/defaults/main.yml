# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/vars.json

traefik_config_file: |
  entryPoints:
    web:
      address: :80
  providers:
    docker:
      network: homelab-podman
    file:
      filename: /etc/traefik/provider.yml

traefik_env: {}

traefik_file_provider: '{}'

traefik_ip_address: 0.0.0.0

traefik_podman_quadlet_container_extra: []

traefik_podman_quadlet_pod_extra: []

traefik_state: present

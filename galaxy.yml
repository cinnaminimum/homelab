# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/galaxy.json
#
# https://docs.ansible.com/ansible/latest/dev_guide/collections_galaxy_meta.html

authors:
  - Gerald Ya Ya

dependencies:
  "ansible.utils": "*"
  "containers.podman": "*"

description: Install and configure homelab apps as quadlets with ansible
documentation: https://cinnaminimum.codeberg.page/homelab
issues: https://codeberg.org/cinnaminimum/homelab/issues
license_file: LICENSE.md

manifest:
  directives:
    - include roles/*/README.md
    - include roles/*/files/*

name: "homelab"
namespace: "cinnaminimum"
readme: README.md
repository: https://codeberg.org/cinnaminimum/homelab

tags:
  - application
  - debian
  - homelab
  - linux
  - podman
  - quadlet

version: 0.1.0
